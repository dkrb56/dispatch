[package]
name = "dispatch"
version = "0.1.57"
description = "Run Claude Code as a team: one triage chat, background workers, and you deciding"
authors = ["dkrb56"]
license = "Apache-2.0"
repository = "https://github.com/dkrb56/dispatch"
edition = "2024"
# Two binaries: `cargo run` (and `tauri dev`) start the window.
default-run = "dispatch"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dispatch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The headless host of docs/remote-client.md: the same core, a WebSocket in place of the window.
[[bin]]
name = "dispatch-host"
path = "src/host/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
portable-pty = "0.9"
base64 = "0.22"
# The host only: the WebSocket service, the folders without Tauri, the key, the stop with Ctrl+C.
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
dirs = "7"
getrandom = "0.3"
ctrlc = "3"

# Windows only: the registry (saved variables) and the process tools (ToolHelp, TerminateProcess).
[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_System_WindowsProgramming", "Win32_System_Power"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
