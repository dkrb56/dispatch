# Builds the macOS disk image of Dispatch and adds it to the existing GitHub release v<version>.
# The Windows installer is built on the PC of the release and uploaded there by
# scripts/release.ps1 publish, which also makes the release. This workflow runs only by hand
# (Actions > Release > Run workflow, or scripts/release.ps1 mac) on the tag of a release; the tag
# must be v<version of src-tauri/tauri.conf.json>. It never makes a release: it fails when the
# release is missing. No secret but the token of the run; the files are not signed.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    name: macOS disk image
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Rust for Apple silicon and Intel
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: npm ci
      # The app takes every program of the crate, but a universal build joins only the main one for
      # the two chips; without this step bundling fails on dispatch-host (v0.1.53). The library
      # embeds ../dist, so the page is built first.
      - name: dispatch-host for Apple silicon and Intel
        run: |
          npm run build
          cd src-tauri
          cargo build --release --bin dispatch-host --target aarch64-apple-darwin
          cargo build --release --bin dispatch-host --target x86_64-apple-darwin
          mkdir -p target/universal-apple-darwin/release
          lipo -create -output target/universal-apple-darwin/release/dispatch-host \
            target/aarch64-apple-darwin/release/dispatch-host \
            target/x86_64-apple-darwin/release/dispatch-host
          lipo -info target/universal-apple-darwin/release/dispatch-host
      - name: Build the universal disk image
        run: npm run tauri build -- --target universal-apple-darwin --bundles dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  release:
    name: Add the disk image to the release
    needs: [macos]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Upload to the release of the tag
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "The tag $GITHUB_REF_NAME does not match the version $version in src-tauri/tauri.conf.json." >&2
            exit 1
          fi
          ls -l files
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "The release $tag does not exist. Make the Windows release on the PC first (scripts/release.ps1 publish)." >&2
            exit 1
          fi
          gh release upload "$tag" files/* --repo "$GITHUB_REPOSITORY" --clobber
          # The notes of the PC say that the version has no disk image: drop that line and add the
          # Mac paragraph, unless the notes have it already.
          body=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json body --jq .body | tr -d '\r')
          kept=$(printf '%s\n' "$body" | grep -v '^This version has no macOS disk image' || true)
          printf '%s\n' "$kept" > notes.md
          if ! grep -q 'xattr -cr' notes.md; then
            cat >> notes.md <<'EOF'

          macOS (11 or newer, Apple silicon and Intel): download `Dispatch_<version>_universal.dmg`, open it and drag Dispatch to Applications. The app is not signed, so macOS says it is damaged. Before the first start, run this once in Terminal:

              xattr -cr /Applications/Dispatch.app
          EOF
            sed -i "s/<version>/$version/g" notes.md
          fi
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
